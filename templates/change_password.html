<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Change Password | Japanese Notes</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >
    <link
    rel="stylesheet"
    href="{{ url_for('static', filename='css/app-background.css') }}"
>

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        body {
    margin: 0;
    min-height: 100vh;

    font-family:
        Arial,
        Helvetica,
        sans-serif;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 40px 20px;

    color: #29253b;
}

        /* =====================================
           BACKGROUND OVERLAY
        ====================================== */

        body::before {
            content: "";

            position: fixed;

            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.14),
                    rgba(225,215,255,0.16)
                );

            pointer-events: none;

            z-index: 0;
        }


        /* =====================================
           MAIN CARD
        ====================================== */

        .password-card {
            position: relative;

            z-index: 1;

            width: min(100%, 560px);

            padding: 42px;

            border-radius: 28px;

            background:
                rgba(255, 255, 255, 0.68);

            border:
                1px solid rgba(255,255,255,0.72);

            box-shadow:
                0 25px 70px rgba(60, 45, 100, 0.20);

            backdrop-filter:
                blur(22px);

            -webkit-backdrop-filter:
                blur(22px);
        }


        /* =====================================
           HEADER
        ====================================== */

        .password-header {
            text-align: center;

            margin-bottom: 32px;
        }


        .password-icon {
            width: 72px;
            height: 72px;

            margin: 0 auto 18px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 22px;

            background:
                linear-gradient(
                    135deg,
                    #eee8ff,
                    #ffe9f1
                );

            color: #6258ce;

            font-size: 28px;

            box-shadow:
                0 10px 25px rgba(98,88,206,0.12);
        }


        .password-header h1 {
            margin: 0;

            font-size: 30px;

            font-weight: 800;

            color: #29253b;
        }


        .password-header p {
            margin: 9px 0 0;

            font-size: 14px;

            line-height: 1.6;

            color: #77728d;
        }


        /* =====================================
           ALERTS
        ====================================== */

        .message {
            padding: 13px 15px;

            border-radius: 12px;

            margin-bottom: 20px;

            font-size: 13px;

            line-height: 1.5;
        }


        .message.error {
            background: rgba(255, 235, 240, 0.92);

            color: #c74669;

            border:
                1px solid #f3c8d3;
        }


        .message.success {
            background: rgba(231, 249, 238, 0.92);

            color: #39805a;

            border:
                1px solid #c7e8d3;
        }


        /* =====================================
           FORM
        ====================================== */

        .form-group {
            margin-bottom: 20px;
        }


        .form-group label {
            display: block;

            margin-bottom: 8px;

            font-size: 13px;

            font-weight: 700;

            color: #383249;
        }


        .input-wrap {
            position: relative;
        }


        .input-wrap input {
            width: 100%;

            height: 52px;

            padding:
                0 48px 0 16px;

            border-radius: 13px;

            border:
                1px solid #ddd7ea;

            background:
                rgba(255,255,255,0.82);

            color: #302b42;

            font-size: 14px;

            outline: none;

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .input-wrap input:focus {
            border-color: #7669d8;

            box-shadow:
                0 0 0 4px rgba(98,88,206,0.10);
        }


        .toggle-password {
            position: absolute;

            right: 14px;
            top: 50%;

            transform:
                translateY(-50%);

            border: none;

            background: transparent;

            color: #77728d;

            cursor: pointer;

            font-size: 15px;
        }


        .toggle-password:hover {
            color: #6258ce;
        }


        /* =====================================
           BUTTONS
        ====================================== */

        .form-actions {
            display: flex;

            gap: 12px;

            margin-top: 28px;
        }


        .btn {
            flex: 1;

            min-height: 50px;

            border-radius: 13px;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 9px;

            font-size: 14px;

            font-weight: 800;

            text-decoration: none;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .btn-primary {
            border: none;

            background:
                linear-gradient(
                    135deg,
                    #6258ce,
                    #7668dc
                );

            color: white;

            box-shadow:
                0 10px 25px rgba(98,88,206,0.22);
        }


        .btn-primary:hover {
            transform: translateY(-2px);

            box-shadow:
                0 15px 30px rgba(98,88,206,0.28);
        }


        .btn-secondary {
            border:
                1px solid #ddd7ea;

            background:
                rgba(255,255,255,0.72);

            color: #6258ce;
        }


        .btn-secondary:hover {
            transform: translateY(-2px);

            background: white;
        }


        /* =====================================
           SECURITY NOTE
        ====================================== */

        .security-note {
            display: flex;

            align-items: flex-start;

            gap: 10px;

            margin-top: 25px;

            padding: 13px 14px;

            border-radius: 12px;

            background:
                rgba(246,243,255,0.72);

            color: #77728d;

            font-size: 12px;

            line-height: 1.55;
        }


        .security-note i {
            color: #6258ce;

            margin-top: 2px;
        }


        /* =====================================
           MOBILE
        ====================================== */

        @media (max-width: 600px) {

            body {
                padding: 20px 14px;
            }

            .password-card {
                padding: 28px 20px;

                border-radius: 22px;
            }

            .password-header h1 {
                font-size: 25px;
            }

            .form-actions {
                flex-direction: column;
            }

            .btn {
                width: 100%;
            }
        }

    </style>

</head>


<body>


    <main class="password-card">


        <!-- HEADER -->

        <div class="password-header">

            <div class="password-icon">
                <i class="fa-solid fa-lock"></i>
            </div>

            <h1>
                Change Password
            </h1>

            <p>
                Update your password to keep your
                Japanese Notes account secure.
            </p>

        </div>


        <!-- ERROR -->

        {% if error %}

            <div class="message error">
                <i class="fa-solid fa-circle-exclamation"></i>
                {{ error }}
            </div>

        {% endif %}


        <!-- SUCCESS -->

        {% if success %}

            <div class="message success">
                <i class="fa-solid fa-circle-check"></i>
                {{ success }}
            </div>

        {% endif %}


        <!-- FORM -->

        <form
            method="POST"
            action="{{ url_for('change_password') }}"
        >


            <!-- CURRENT PASSWORD -->

            <div class="form-group">

                <label for="current_password">
                    Current Password
                </label>

                <div class="input-wrap">

                    <input
                        type="password"
                        id="current_password"
                        name="current_password"
                        placeholder="Enter your current password"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('current_password', this)"
                        aria-label="Show password"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>

            </div>


            <!-- NEW PASSWORD -->

            <div class="form-group">

                <label for="new_password">
                    New Password
                </label>

                <div class="input-wrap">

                    <input
                        type="password"
                        id="new_password"
                        name="new_password"
                        placeholder="Enter your new password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('new_password', this)"
                        aria-label="Show password"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>

            </div>


            <!-- CONFIRM PASSWORD -->

            <div class="form-group">

                <label for="confirm_password">
                    Confirm New Password
                </label>

                <div class="input-wrap">

                    <input
                        type="password"
                        id="confirm_password"
                        name="confirm_password"
                        placeholder="Re-enter your new password"
                        minlength="6"
                        required
                    >

                    <button
                        type="button"
                        class="toggle-password"
                        onclick="togglePassword('confirm_password', this)"
                        aria-label="Show password"
                    >
                        <i class="fa-solid fa-eye"></i>
                    </button>

                </div>

            </div>


            <!-- BUTTONS -->

            <div class="form-actions">

                <a
                    href="{{ url_for('settings') }}"
                    class="btn btn-secondary"
                >
                    <i class="fa-solid fa-arrow-left"></i>
                    Back to Settings
                </a>


                <button
                    type="submit"
                    class="btn btn-primary"
                >
                    <i class="fa-solid fa-lock"></i>
                    Change Password
                </button>

            </div>


        </form>


        <!-- SECURITY NOTE -->

        <div class="security-note">

            <i class="fa-solid fa-shield-halved"></i>

            <span>
                Your new password is securely stored
                and can be used the next time you log in.
            </span>

        </div>


    </main>


    <script>

        function togglePassword(
            inputId,
            button
        ) {

            const input =
                document.getElementById(inputId);

            const icon =
                button.querySelector("i");


            if (input.type === "password") {

                input.type = "text";

                icon.classList.remove(
                    "fa-eye"
                );

                icon.classList.add(
                    "fa-eye-slash"
                );

            } else {

                input.type = "password";

                icon.classList.remove(
                    "fa-eye-slash"
                );

                icon.classList.add(
                    "fa-eye"
                );

            }

        }

    </script>


</body>

</html>
