<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ note[2] }}</title>


    <!-- =====================================================
         MAIN THEME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >


    <!-- =====================================================
         FIXED BACKGROUND
    ====================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/app-background.css') }}"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        body {
            margin: 0;
            min-height: 100vh;

            background: transparent !important;

            color: #302b43;

            font-family:
                Arial,
                "Helvetica Neue",
                Helvetica,
                sans-serif;
        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .lesson-container {
            width: min(1080px, calc(100% - 40px));

            margin: 0 auto;

            padding: 36px 0 70px;

            position: relative;

            z-index: 2;
        }


        /* =====================================================
           LESSON CARD
        ===================================================== */

        .lesson-card {
            position: relative;

            padding: 34px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.92),
                    rgba(249,246,255,0.84)
                );

            border: 1px solid rgba(255,255,255,0.90);

            border-radius: 24px;

            box-shadow:
                0 16px 42px rgba(65,50,110,0.11);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            overflow: hidden;
        }


        .lesson-card::before {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            top: -115px;
            right: -105px;

            border-radius: 50%;

            background: rgba(108,99,217,0.07);

            pointer-events: none;
        }


        /* =====================================================
           CATEGORY
        ===================================================== */

        .category {
            display: inline-flex;

            align-items: center;

            padding: 7px 11px;

            margin-bottom: 14px;

            border-radius: 9px;

            background: #f0edff;

            color: #6258ce;

            font-size: 11px;

            font-weight: 800;

            letter-spacing: 0.3px;

            text-transform: uppercase;
        }


        /* =====================================================
           TITLE
        ===================================================== */

        .lesson-card h1 {
            position: relative;
            z-index: 2;

            margin: 0 0 22px;

            color: #302b43;

            font-size: 32px;

            font-weight: 700;

            line-height: 1.3;

            letter-spacing: -0.4px;
        }


        /* =====================================================
           LESSON CONTENT
        ===================================================== */

        .lesson-content {
            position: relative;
            z-index: 2;

            padding: 28px;

            margin-bottom: 24px;

            background: rgba(255,255,255,0.72);

            border: 1px solid #eeeaf5;

            border-radius: 17px;

            color: #4d485d;

            font-size: 17px;

            line-height: 1.9;

            white-space: pre-wrap;

            overflow-wrap: break-word;

            box-shadow:
                0 7px 20px rgba(65,50,110,0.06);
        }


        .lesson-content strong,
        .lesson-content b {
            color: #302b43;
        }


        .lesson-content em {
            color: #6258ce;
        }


        .lesson-content h2,
        .lesson-content h3,
        .lesson-content h4 {
            color: #302b43;

            margin-top: 20px;
            margin-bottom: 10px;
        }


        .lesson-content p,
        .lesson-content li,
        .lesson-content ul,
        .lesson-content ol {
            color: #4d485d;
        }


        /* =====================================================
           COMPLETION AREA
        ===================================================== */

        .completion-area {
            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 16px;

            margin-top: 8px;

            padding-top: 20px;

            border-top: 1px solid #eeeaf5;
        }


        .completion-form {
            margin: 0;
        }


        .completion-check {
            display: inline-flex;

            align-items: center;

            gap: 10px;

            min-height: 43px;

            padding: 0 14px;

            background: transparent;

            border: 1px solid transparent;

            border-radius: 11px;

            color: #514b60;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }


        .completion-check:hover {
            background: #f5f2ff;

            border-color: #e2ddf1;

            transform: translateY(-1px);
        }


        .check-box {
            width: 22px;
            height: 22px;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            border: 2px solid #6258ce;

            border-radius: 6px;

            background: #ffffff;

            color: #ffffff;

            font-size: 13px;

            font-weight: 800;
        }


        .completion-check.is-completed .check-box {
            background: #6258ce;

            border-color: #6258ce;
        }


        .completion-check.is-completed .completion-text {
            color: #4d9b77;
        }


        /* =====================================================
           BACK BUTTON
        ===================================================== */

        .lesson-back {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            min-height: 43px;

            padding: 0 17px;

            background: #6258ce;

            color: #ffffff !important;

            border-radius: 10px;

            text-decoration: none;

            font-size: 13px;

            font-weight: 700;

            box-shadow:
                0 7px 18px rgba(98,88,206,0.20);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        .lesson-back:hover {
            background: #4e45b8;

            color: #ffffff !important;

            transform: translateY(-2px);

            box-shadow:
                0 10px 23px rgba(98,88,206,0.28);
        }


        /* =====================================================
           DARK MODE
        ===================================================== */

        body.dark-mode .lesson-card {
            background:
                linear-gradient(
                    135deg,
                    rgba(29,31,45,0.95),
                    rgba(37,36,54,0.91)
                );

            border-color: rgba(255,255,255,0.08);

            box-shadow:
                0 16px 42px rgba(0,0,0,0.25);
        }


        body.dark-mode .category {
            background: #302e50;

            color: #aaa3ff;
        }


        body.dark-mode .lesson-card h1 {
            color: #f5f2ff;
        }


        body.dark-mode .lesson-content {
            background: rgba(25,27,41,0.72);

            border-color: #3f4256;

            color: #d1cddd;
        }


        body.dark-mode .lesson-content strong,
        body.dark-mode .lesson-content b,
        body.dark-mode .lesson-content h2,
        body.dark-mode .lesson-content h3,
        body.dark-mode .lesson-content h4,
        body.dark-mode .lesson-content p,
        body.dark-mode .lesson-content li,
        body.dark-mode .lesson-content ul,
        body.dark-mode .lesson-content ol {
            color: #d8d4e3;
        }


        body.dark-mode .lesson-content em {
            color: #aaa3ff;
        }


        body.dark-mode .completion-area {
            border-color: #3f4256;
        }


        body.dark-mode .completion-check {
            color: #d1cddd;
        }


        body.dark-mode .completion-check:hover {
            background: #2a2c40;

            border-color: #41445b;
        }


        body.dark-mode .check-box {
            background: #252838;

            border-color: #8c84ea;
        }


        body.dark-mode .completion-check.is-completed .check-box {
            background: #766de0;

            border-color: #766de0;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 700px) {

            .lesson-container {
                width: calc(100% - 24px);

                padding-top: 22px;
            }


            .lesson-card {
                padding: 24px 20px;

                border-radius: 19px;
            }


            .lesson-card h1 {
                font-size: 26px;

                margin-bottom: 18px;
            }


            .lesson-content {
                padding: 21px;

                font-size: 15px;

                line-height: 1.75;

                border-radius: 15px;
            }


            .completion-area {
                flex-direction: column;

                align-items: stretch;
            }


            .completion-check {
                justify-content: center;

                width: 100%;
            }


            .lesson-back {
                width: 100%;
            }
        }

    </style>

</head>


<body>


    <main class="lesson-container">


        <article class="lesson-card">


            <!-- =================================================
                 CATEGORY
            ================================================== -->

            <div class="category">

                📂 {{ note[1] }}

            </div>


            <!-- =================================================
                 TITLE
            ================================================== -->

            <h1>

                {{ note[2] }}

            </h1>


            <!-- =================================================
                 LESSON CONTENT
            ================================================== -->

            <div class="lesson-content">

                {{ note[3] }}

            </div>


            <!-- =================================================
                 COMPLETION + BACK
            ================================================== -->

            <div class="completion-area">


                <form
                    action="/complete_lesson/{{ note[0] }}"
                    method="POST"
                    class="completion-form"
                >

                    <button
                        type="submit"
                        class="completion-check {% if completed %}is-completed{% endif %}"
                    >

                        <span class="check-box">

                            {% if completed %}
                                ✓
                            {% endif %}

                        </span>


                        <span class="completion-text">

                            {% if completed %}
                                Marked as Completed
                            {% else %}
                                Mark as Completed
                            {% endif %}

                        </span>

                    </button>

                </form>


                <a
                    href="/notes"
                    class="lesson-back"
                >

                    <i class="fa-solid fa-arrow-left"></i>

                    Back to Notes

                </a>

            </div>


        </article>


    </main>


    <!-- =====================================================
         DARK MODE
    ====================================================== -->

    <script
        src="{{ url_for('static', filename='js/darkmode.js') }}">
    </script>


    <!-- =====================================================
         PRONUNCIATION
    ====================================================== -->

    <script
        src="{{ url_for('static', filename='js/pronunciation.js') }}">
    </script>


</body>

</html>
