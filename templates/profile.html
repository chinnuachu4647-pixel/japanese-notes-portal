<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>My Profile</title>


    <!-- =====================================================
         MAIN THEME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >


    <!-- =====================================================
         FIXED BACKGROUND
    ====================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/app-background.css') }}"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        body {
            margin: 0;
            min-height: 100vh;

            background: transparent !important;

            color: #302b43;

            font-family:
                Arial,
                "Helvetica Neue",
                Helvetica,
                sans-serif;
        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .profile-container {
            width: min(720px, calc(100% - 40px));

            margin: 0 auto;

            padding: 45px 0 70px;

            position: relative;

            z-index: 2;
        }


        /* =====================================================
           PROFILE CARD
        ===================================================== */

        .profile-card {
            position: relative;

            padding: 38px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.92),
                    rgba(249,246,255,0.85)
                );

            border: 1px solid rgba(255,255,255,0.90);

            border-radius: 24px;

            box-shadow:
                0 16px 42px rgba(65,50,110,0.11);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            overflow: hidden;
        }


        .profile-card::before {
            content: "";

            position: absolute;

            width: 210px;
            height: 210px;

            top: -105px;
            right: -95px;

            border-radius: 50%;

            background: rgba(108,99,217,0.07);

            pointer-events: none;
        }


        /* =====================================================
           PROFILE HEADER
        ===================================================== */

        .profile-header {
            position: relative;

            z-index: 2;

            display: flex;

            align-items: center;

            gap: 20px;

            margin-bottom: 32px;
        }


        .profile-avatar {
            width: 82px;
            height: 82px;

            flex-shrink: 0;

            object-fit: contain;

            padding: 8px;

            background:
                linear-gradient(
                    145deg,
                    #f1edff,
                    #ebe6ff
                );

            border: 1px solid rgba(255,255,255,0.9);

            border-radius: 22px;

            box-shadow:
                0 10px 25px rgba(98,88,206,0.10);
        }


        .profile-header-text h1 {
            margin: 0;

            color: #302b43;

            font-size: 30px;

            font-weight: 700;

            line-height: 1.2;
        }


        .profile-header-text p {
            margin: 6px 0 0;

            color: #817a91;

            font-size: 14px;
        }


        /* =====================================================
           INFORMATION LIST
        ===================================================== */

        .profile-info {
            position: relative;

            z-index: 2;

            display: flex;

            flex-direction: column;

            gap: 13px;
        }


        .profile-row {
            display: flex;

            align-items: center;

            gap: 16px;

            padding: 17px 18px;

            background: rgba(255,255,255,0.68);

            border: 1px solid #eeeaf5;

            border-radius: 14px;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }


        .profile-row:hover {
            background: rgba(255,255,255,0.86);

            border-color:
                rgba(108,99,217,0.18);

            transform: translateX(2px);
        }


        .profile-row-icon {
            width: 42px;
            height: 42px;

            flex-shrink: 0;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 11px;

            background: #f0edff;

            color: #6258ce;

            font-size: 17px;
        }


        .profile-row-content {
            min-width: 0;
        }


        .profile-label {
            display: block;

            margin-bottom: 3px;

            color: #898297;

            font-size: 11px;

            font-weight: 700;

            letter-spacing: 0.4px;

            text-transform: uppercase;
        }


        .profile-value {
            display: block;

            color: #302b43;

            font-size: 16px;

            font-weight: 600;

            word-break: break-word;
        }


        /* =====================================================
           PROFILE ACTIONS
        ===================================================== */

        .profile-actions {
            position: relative;

            z-index: 2;

            display: flex;

            align-items: center;

            gap: 12px;

            margin-top: 28px;

            padding-top: 22px;

            border-top: 1px solid #eeeaf5;
        }


        .profile-back-btn,
        .profile-edit-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            min-height: 44px;

            padding: 0 18px;

            border-radius: 11px;

            text-decoration: none;

            font-size: 13px;

            font-weight: 700;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                color 0.2s ease,
                box-shadow 0.2s ease;
        }


        /* =====================================================
           BACK TO SETTINGS
        ===================================================== */

        .profile-back-btn {
            background: #f2effb;

            color: #6258ce;

            border: 1px solid #e1dcec;
        }


        .profile-back-btn:hover {
            background: #e8e4f7;

            color: #4e45b8;

            transform: translateY(-2px);
        }


        /* =====================================================
           EDIT PROFILE
        ===================================================== */

        .profile-edit-btn {
            background: #6258ce;

            color: #ffffff !important;

            border: 1px solid #6258ce;

            box-shadow:
                0 7px 18px rgba(98,88,206,0.20);
        }


        .profile-edit-btn:hover {
            background: #4e45b8;

            color: #ffffff !important;

            transform: translateY(-2px);

            box-shadow:
                0 10px 23px rgba(98,88,206,0.28);
        }


        /* =====================================================
           DARK MODE
        ===================================================== */

        body.dark-mode .profile-card {
            background:
                linear-gradient(
                    135deg,
                    rgba(29,31,45,0.95),
                    rgba(37,36,54,0.91)
                );

            border-color: rgba(255,255,255,0.08);

            box-shadow:
                0 16px 42px rgba(0,0,0,0.25);
        }


        body.dark-mode .profile-avatar {
            background:
                linear-gradient(
                    145deg,
                    #302e50,
                    #2a2c40
                );

            border-color: #41445b;
        }


        body.dark-mode .profile-header-text h1 {
            color: #f5f2ff;
        }


        body.dark-mode .profile-header-text p {
            color: #aaa6bb;
        }


        body.dark-mode .profile-row {
            background:
                rgba(29,31,45,0.68);

            border-color: #3f4256;
        }


        body.dark-mode .profile-row:hover {
            background:
                rgba(35,37,53,0.84);

            border-color:
                rgba(145,136,242,0.30);
        }


        body.dark-mode .profile-row-icon {
            background: #302e50;

            color: #aaa3ff;
        }


        body.dark-mode .profile-label {
            color: #9993aa;
        }


        body.dark-mode .profile-value {
            color: #eeeaf7;
        }


        body.dark-mode .profile-actions {
            border-color: #3f4256;
        }


        body.dark-mode .profile-back-btn {
            background: #252838;

            color: #aaa3ff;

            border-color: #41445b;
        }


        body.dark-mode .profile-back-btn:hover {
            background: #303348;

            color: #c0baff;
        }


        body.dark-mode .profile-edit-btn {
            background: #766de0;

            border-color: #766de0;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .profile-container {
                width: calc(100% - 24px);

                padding-top: 24px;
            }


            .profile-card {
                padding: 24px 18px;

                border-radius: 20px;
            }


            .profile-header {
                align-items: flex-start;

                gap: 14px;

                margin-bottom: 24px;
            }


            .profile-avatar {
                width: 66px;
                height: 66px;

                border-radius: 17px;
            }


            .profile-header-text h1 {
                font-size: 24px;
            }


            .profile-header-text p {
                font-size: 12px;
            }


            .profile-row {
                padding: 15px;

                gap: 12px;
            }


            .profile-row-icon {
                width: 38px;
                height: 38px;

                font-size: 15px;
            }


            .profile-value {
                font-size: 14px;
            }


            .profile-actions {
                flex-direction: column;

                align-items: stretch;
            }


            .profile-back-btn,
            .profile-edit-btn {
                width: 100%;
            }

        }

    </style>

</head>


<body>


    <main class="profile-container">


        <section class="profile-card">


            <!-- =================================================
                 PROFILE HEADER
            ================================================== -->

            <header class="profile-header">

                <img
                    src="{{ url_for('static', filename='images/logo.png') }}"
                    class="profile-avatar"
                    alt="Japanese Learning Portal"
                >


                <div class="profile-header-text">

                    <h1>
                        My Profile
                    </h1>


                    <p>
                        Your Japanese Learning Portal account
                    </p>

                </div>

            </header>


            <!-- =================================================
                 PROFILE INFORMATION
            ================================================== -->

            <div class="profile-info">


                <!-- NAME -->

                <div class="profile-row">

                    <div class="profile-row-icon">

                        <i class="fa-solid fa-user"></i>

                    </div>


                    <div class="profile-row-content">

                        <span class="profile-label">
                            Name
                        </span>


                        <span class="profile-value">
                            {{ user[0] }}
                        </span>

                    </div>

                </div>


                <!-- EMAIL -->

                <div class="profile-row">

                    <div class="profile-row-icon">

                        <i class="fa-solid fa-envelope"></i>

                    </div>


                    <div class="profile-row-content">

                        <span class="profile-label">
                            Email
                        </span>


                        <span class="profile-value">
                            {{ user[1] }}
                        </span>

                    </div>

                </div>


                <!-- DATE OF BIRTH -->

                <div class="profile-row">

                    <div class="profile-row-icon">

                        <i class="fa-solid fa-calendar"></i>

                    </div>


                    <div class="profile-row-content">

                        <span class="profile-label">
                            Date of Birth
                        </span>


                        <span class="profile-value">
                            {{ user[2] }}
                        </span>

                    </div>

                </div>


            </div>


            <!-- =================================================
                 PROFILE ACTIONS
            ================================================== -->

            <div class="profile-actions">


                <!-- BACK TO SETTINGS -->

                <a
                    href="/settings"
                    class="profile-back-btn"
                >

                    <i class="fa-solid fa-arrow-left"></i>

                    Back to Settings

                </a>


                <!-- EDIT PROFILE -->

                <a
                    href="/edit_profile"
                    class="profile-edit-btn"
                >

                    <i class="fa-solid fa-pen"></i>

                    Edit Profile

                </a>

            </div>


        </section>

    </main>


    <!-- =====================================================
         DARK MODE
    ====================================================== -->

    <script
        src="{{ url_for('static', filename='js/darkmode.js') }}">
    </script>


    <!-- =====================================================
         PRONUNCIATION
    ====================================================== -->

    <script
        src="{{ url_for('static', filename='js/pronunciation.js') }}">
    </script>


</body>

</html>
