<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>{{ category }} Lessons</title>


    <!-- =====================================================
         MAIN THEME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >


    <!-- =====================================================
         FIXED BACKGROUND
    ====================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/app-background.css') }}"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >


    <!-- =====================================================
         PAGE STYLE
    ====================================================== -->

    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        body {
            margin: 0;
            min-height: 100vh;

            font-family:
                Arial,
                "Helvetica Neue",
                Helvetica,
                sans-serif;

            background: transparent !important;

            color: #302b43;
        }


        /* =====================================================
           MAIN CONTAINER
        ===================================================== */

        .lessons-container {
            width: min(1120px, calc(100% - 40px));

            margin: 0 auto;

            padding: 36px 0 75px;

            position: relative;

            z-index: 2;
        }


        /* =====================================================
           BACK BUTTON
        ===================================================== */

        .back-btn {
            width: 44px;
            height: 44px;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            margin-bottom: 22px;

            background: rgba(255,255,255,0.88);

            border: 1px solid #e3deed;

            border-radius: 12px;

            color: #6258ce;

            font-size: 17px;

            text-decoration: none;

            box-shadow:
                0 6px 18px rgba(60,50,100,0.08);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                color 0.2s ease;
        }


        .back-btn:hover {
            background: #f3efff;

            color: #4e45b8;

            transform: translateX(-3px);
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .lessons-header {
            position: relative;

            display: flex;

            align-items: center;
            justify-content: space-between;

            gap: 25px;

            margin-bottom: 24px;

            padding: 28px 32px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.91),
                    rgba(248,245,255,0.84)
                );

            border: 1px solid rgba(255,255,255,0.88);

            border-radius: 22px;

            box-shadow:
                0 14px 38px rgba(65,50,110,0.10);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            overflow: hidden;
        }


        .lessons-header::after {
            content: "📚";

            position: absolute;

            right: 28px;
            bottom: 15px;

            font-size: 42px;

            opacity: 0.15;

            pointer-events: none;
        }


        .lessons-header-text {
            position: relative;

            z-index: 2;
        }


        .lessons-eyebrow {
            display: block;

            margin-bottom: 6px;

            color: #827b94;

            font-size: 12px;

            font-weight: 700;

            letter-spacing: 0.7px;

            text-transform: uppercase;
        }


        .lessons-header h1 {
            margin: 0;

            color: #302b43;

            font-size: 32px;

            font-weight: 700;

            line-height: 1.2;

            letter-spacing: -0.5px;
        }


        .lessons-header p {
            margin: 7px 0 0;

            color: #77718e;

            font-size: 14px;

            line-height: 1.5;
        }


        /* =====================================================
           SEARCH
        ===================================================== */

        .search-box {
            margin-bottom: 22px;
        }


        #lesson-search {
            width: 100%;

            height: 48px;

            padding: 0 16px;

            border: 1px solid rgba(255,255,255,0.88);

            border-radius: 13px;

            background: rgba(255,255,255,0.86);

            color: #302b43;

            font-size: 14px;

            outline: none;

            box-shadow:
                0 8px 24px rgba(65,50,110,0.08);

            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);

            transition:
                border-color 0.2s ease,
                box-shadow 0.2s ease,
                background 0.2s ease;
        }


        #lesson-search::placeholder {
            color: #8b8598;
        }


        #lesson-search:focus {
            background: rgba(255,255,255,0.96);

            border-color: rgba(108,99,217,0.35);

            box-shadow:
                0 0 0 3px rgba(108,99,217,0.10),
                0 8px 24px rgba(65,50,110,0.10);
        }


        /* =====================================================
   LESSON LIST
===================================================== */

.lesson-list {
    display: flex;
    flex-direction: column;
    gap: 16px;
}


/* =====================================================
   LESSON CARD
===================================================== */

.lesson-card {
    position: relative;

    display: flex;
    align-items: center;
    justify-content: space-between;

    gap: 24px;

    min-height: 118px;

    padding: 22px 24px 22px 28px;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.94),
            rgba(249,246,255,0.86)
        );

    border: 1px solid rgba(255,255,255,0.92);

    border-radius: 20px;

    box-shadow:
        0 10px 28px rgba(65,50,110,0.09);

    backdrop-filter: blur(15px);
    -webkit-backdrop-filter: blur(15px);

    overflow: hidden;

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        border-color 0.25s ease,
        background 0.25s ease;
}


/* left accent */

.lesson-card::before {
    content: "";

    position: absolute;

    left: 0;
    top: 0;
    bottom: 0;

    width: 5px;

    background:
        linear-gradient(
            180deg,
            #6258ce,
            #c56c91
        );

    border-radius: 20px 0 0 20px;
}


/* soft decorative circle */

.lesson-card::after {
    content: "🌸";

    position: absolute;

    right: 20px;
    top: -12px;

    font-size: 48px;

    opacity: 0.08;

    pointer-events: none;
}


/* hover */

.lesson-card:hover {
    transform: translateY(-4px);

    border-color:
        rgba(108,99,217,0.25);

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.98),
            rgba(246,242,255,0.94)
        );

    box-shadow:
        0 17px 38px rgba(65,50,110,0.14);
}


/* =====================================================
   LESSON INFO
===================================================== */

.lesson-info {
    position: relative;
    z-index: 2;

    flex: 1;

    min-width: 0;

    padding-left: 8px;
}


.lesson-info::before {
    content: "LESSON";

    display: inline-block;

    margin-bottom: 7px;

    color: #8a8399;

    font-size: 10px;

    font-weight: 800;

    letter-spacing: 1px;
}


.lesson-info h2 {
    margin: 0 0 6px;

    color: #302b43;

    font-size: 20px;

    font-weight: 700;

    line-height: 1.35;

    word-break: break-word;
}


.lesson-info p {
    margin: 0;

    color: #817a91;

    font-size: 13px;

    line-height: 1.5;
}


/* =====================================================
   READ BUTTON
===================================================== */

.read-btn {
    position: relative;
    z-index: 3;

    display: inline-flex;

    align-items: center;
    justify-content: center;

    gap: 9px;

    min-width: 128px;

    min-height: 44px;

    padding: 0 18px;

    flex-shrink: 0;

    background:
        linear-gradient(
            135deg,
            #6258ce,
            #766de0
        );

    color: #ffffff !important;

    border: none;

    border-radius: 11px;

    text-decoration: none;

    font-size: 13px;

    font-weight: 700;

    box-shadow:
        0 7px 18px rgba(98,88,206,0.22);

    transition:
        transform 0.2s ease,
        box-shadow 0.2s ease,
        background 0.2s ease;
}


.read-btn i {
    font-size: 11px;

    transition:
        transform 0.2s ease;
}


.read-btn:hover {
    background:
        linear-gradient(
            135deg,
            #4e45b8,
            #6258ce
        );

    color: #ffffff !important;

    transform: translateY(-2px);

    box-shadow:
        0 11px 24px rgba(98,88,206,0.30);
}


.read-btn:hover i {
    transform: translateX(3px);
}


/* =====================================================
   NO LESSONS
===================================================== */

.no-lessons {
    padding: 45px 28px;

    text-align: center;

    background:
        linear-gradient(
            135deg,
            rgba(255,255,255,0.94),
            rgba(249,246,255,0.88)
        );

    border:
        1px solid rgba(255,255,255,0.9);

    border-radius: 20px;

    box-shadow:
        0 12px 30px rgba(65,50,110,0.09);

    backdrop-filter: blur(14px);
}


.no-lessons h2 {
    margin: 0 0 8px;

    color: #302b43;

    font-size: 22px;
}


.no-lessons p {
    margin: 0;

    color: #77718e;

    font-size: 14px;
}


/* =====================================================
   DARK MODE
===================================================== */

body.dark-mode .lesson-card {
    background:
        linear-gradient(
            135deg,
            rgba(29,31,45,0.96),
            rgba(37,36,54,0.92)
        );

    border-color:
        rgba(255,255,255,0.08);

    box-shadow:
        0 12px 32px rgba(0,0,0,0.24);
}


body.dark-mode .lesson-card:hover {
    background:
        linear-gradient(
            135deg,
            rgba(35,37,53,0.98),
            rgba(43,41,61,0.95)
        );

    border-color:
        rgba(145,136,242,0.38);

    box-shadow:
        0 18px 40px rgba(0,0,0,0.30);
}


body.dark-mode .lesson-info::before {
    color: #9993aa;
}


body.dark-mode .lesson-info h2 {
    color: #f5f2ff;
}


body.dark-mode .lesson-info p {
    color: #aaa6bb;
}


body.dark-mode .read-btn {
    background:
        linear-gradient(
            135deg,
            #766de0,
            #8d84ea
        );
}


body.dark-mode .no-lessons {
    background:
        linear-gradient(
            135deg,
            rgba(29,31,45,0.96),
            rgba(37,36,54,0.92)
        );

    border-color:
        rgba(255,255,255,0.08);
}


body.dark-mode .no-lessons h2 {
    color: #f5f2ff;
}


body.dark-mode .no-lessons p {
    color: #aaa6bb;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

    .lesson-card {
        min-height: auto;

        flex-direction: column;

        align-items: stretch;

        gap: 18px;

        padding: 21px 20px 21px 24px;
    }


    .lesson-info {
        padding-left: 3px;
    }


    .lesson-info h2 {
        font-size: 18px;
    }


    .lesson-info p {
        font-size: 12px;
    }


    .read-btn {
        width: 100%;
    }
}
    </style>

</head>


<body>


    <main class="lessons-container">


        <!-- =================================================
             BACK
        ================================================== -->

        <a
            href="{{ url_for('notes') }}"
            class="back-btn"
            aria-label="Back to Notes"
            title="Back to Notes"
        >

            <i class="fa-solid fa-arrow-left"></i>

        </a>


        <!-- =================================================
             HEADER
        ================================================== -->

        <header class="lessons-header">

            <div class="lessons-header-text">

                <span class="lessons-eyebrow">
                    Japanese Study
                </span>

                <h1>
                    📚 {{ category }} Lessons
                </h1>

                <p>
                    Welcome Back Buddy👋
                    <br>
                    Choose a lesson and continue learning.
                </p>

            </div>

        </header>


        <!-- =================================================
             SEARCH
        ================================================== -->

        <div class="search-box">

            <input
                type="text"
                id="lesson-search"
                placeholder="🔍 Search {{ category }} lessons..."
                autocomplete="off"
                aria-label="Search lessons"
            >

        </div>


        <!-- =================================================
             LESSONS
        ================================================== -->

        {% if notes %}

            <div class="lesson-list">

                {% for note in notes %}

                    <article class="lesson-card">

                        <div class="lesson-info">

                            <h2>
                                {{ note[2] }}
                            </h2>

                            <p>
                                {{ category }} lesson
                            </p>

                        </div>


                        <a
                            href="{{ url_for('single_note', note_id=note[0]) }}"
                            class="read-btn"
                        >
                            Read More
                            <i class="fa-solid fa-arrow-right"></i>
                        </a>

                    </article>

                {% endfor %}

            </div>

        {% else %}

            <!-- =================================================
                 NO LESSONS
            ================================================== -->

            <div class="no-lessons">

                <h2>
                    📚 No Lessons Yet
                </h2>

                <p>
                    There are no lessons available in
                    {{ category }} yet.
                </p>

            </div>

        {% endif %}


    </main>
    <!-- =====================================================
         SEARCH
    ====================================================== -->

    <script>

        document.addEventListener(
            "DOMContentLoaded",
            function () {

                const searchInput =
                    document.getElementById("lesson-search");

                const lessonCards =
                    document.querySelectorAll(".lesson-card");


                if (!searchInput) {
                    return;
                }


                searchInput.addEventListener(
                    "input",
                    function () {

                        const searchText =
                            searchInput.value
                                .toLowerCase()
                                .trim();


                        lessonCards.forEach(
                            function (card) {

                                const titleElement =
                                    card.querySelector(
                                        ".lesson-info h2"
                                    );


                                const lessonTitle =
                                    titleElement
                                        ? titleElement
                                            .textContent
                                            .toLowerCase()
                                        : "";


                                card.style.display =
                                    lessonTitle.includes(
                                        searchText
                                    )
                                        ? "flex"
                                        : "none";

                            }
                        );

                    }
                );

            }
        );

    </script>


    <!-- =====================================================
         DARK MODE
    ====================================================== -->

    <script
        src="{{ url_for('static', filename='js/darkmode.js') }}">
    </script>


    <!-- =====================================================
         PRONUNCIATION
    ====================================================== -->

    <script
        src="{{ url_for('static', filename='js/pronunciation.js') }}">
    </script>


</body>

</html>
