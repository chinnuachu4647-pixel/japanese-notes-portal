<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>JLPT N5 Practice</title>


    <!-- =====================================================
         MAIN CSS
    ====================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >


    <!-- =====================================================
         FIXED BACKGROUND
    ====================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/app-background.css') }}"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    >


    <style>

        /* =====================================================
           RESET
        ====================================================== */

        * {
            box-sizing: border-box;
        }


        /* =====================================================
           BODY
        ====================================================== */

        body {
            margin: 0;
            min-height: 100vh;

            background: transparent !important;

            font-family:
                Arial,
                Helvetica,
                sans-serif;

            color: #302b43;
        }


        /* =====================================================
           PAGE
        ====================================================== */

        .n5-page {
            width: min(800px, calc(100% - 30px));

            margin: 0 auto;

            padding: 35px 0 70px;

            position: relative;

            z-index: 2;
        }


        /* =====================================================
           MAIN CARD
        ====================================================== */

        .n5-card {

            padding: 32px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.94),
                    rgba(249,246,255,0.87)
                );

            border:
                1px solid rgba(255,255,255,0.90);

            border-radius: 24px;

            box-shadow:
                0 16px 42px rgba(65,50,110,0.11);

            backdrop-filter: blur(16px);

            -webkit-backdrop-filter: blur(16px);

            overflow: hidden;
        }


        /* =====================================================
           TOP AREA
        ====================================================== */

        .n5-top {

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 20px;

            margin-bottom: 22px;

            padding-bottom: 16px;

            border-bottom:
                1px solid #eeeaf5;

            color: #817a91;

            font-size: 13px;

            font-weight: 700;
        }


        .n5-progress-text {

            display: block;

            margin-bottom: 8px;
        }


        .n5-score {

            white-space: nowrap;

            color: #6258ce;
        }


        /* =====================================================
           PROGRESS BAR
        ====================================================== */

        .n5-progress-bar {

            width: 240px;

            height: 7px;

            overflow: hidden;

            border-radius: 999px;

            background: #ebe7f4;
        }


        .n5-progress-fill {

            width: 0%;

            height: 100%;

            border-radius: inherit;

            background:
                linear-gradient(
                    90deg,
                    #6258ce,
                    #c56c91
                );

            transition:
                width 0.25s ease;
        }


        /* =====================================================
           CATEGORY
        ====================================================== */

        .n5-category {

            display: inline-flex;

            align-items: center;

            min-height: 30px;

            padding: 0 12px;

            margin-bottom: 10px;

            border-radius: 999px;

            background: #f0edff;

            color: #6258ce;

            border:
                1px solid #e1dcf3;

            font-size: 11px;

            font-weight: 800;

            text-transform: uppercase;

            letter-spacing: 0.5px;
        }


        /* =====================================================
           TITLE
        ====================================================== */

        .n5-title {

            margin: 0;

            color: #302b43;

            font-size: 30px;

            line-height: 1.25;
        }


        /* =====================================================
           SUBTITLE
        ====================================================== */

        .n5-subtitle {

            margin: 7px 0 22px;

            color: #77718e;

            font-size: 14px;

            line-height: 1.5;
        }


        /* =====================================================
           QUESTION ROW
        ====================================================== */

        .n5-question-row {

            display: flex;

            align-items: center;

            gap: 12px;
        }


        /* =====================================================
           QUESTION
        ====================================================== */

        .n5-question {

            flex: 1;

            padding: 20px;

            background:
                linear-gradient(
                    135deg,
                    #f2efff,
                    #faf8ff
                );

            border:
                1px solid #e5e0f0;

            border-radius: 15px;

            color: #302b43;

            font-size: 21px;

            font-weight: 700;

            line-height: 1.6;
        }


        /* =====================================================
           ENGLISH EXPLANATION
        ====================================================== */

        .n5-english {

            margin-top: 10px;

            color: #817a91;

            font-size: 13px;

            line-height: 1.5;
        }


        /* =====================================================
           SPEAKER BUTTON
        ====================================================== */

        .n5-speaker {

            width: 46px;

            height: 46px;

            flex-shrink: 0;

            display: inline-flex;

            align-items: center;

            justify-content: center;

            padding: 0;

            border:
                1px solid #ddd8eb;

            border-radius: 12px;

            background: #f2effb;

            color: #6258ce;

            font-size: 19px;

            cursor: pointer;

            box-shadow:
                0 6px 16px rgba(98,88,206,0.08);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                color 0.2s ease,
                box-shadow 0.2s ease;
        }


        .n5-speaker:hover {

            background: #e8e4f7;

            color: #4e45b8;

            transform: scale(1.05);
        }


        .n5-speaker:active {

            transform: scale(0.96);
        }


        .n5-speaker.speaking {

            background: #6258ce;

            border-color: #6258ce;

            color: #ffffff;
        }


        /* =====================================================
           OPTIONS
        ====================================================== */

        .n5-options {

            margin-top: 18px;
        }


        .n5-option {

            display: flex;

            align-items: center;

            gap: 10px;

            min-height: 52px;

            padding: 15px;

            margin-top: 10px;

            background:
                rgba(255,255,255,0.75);

            border:
                1px solid #e6e1ef;

            border-radius: 12px;

            cursor: pointer;

            color: #504a5e;

            line-height: 1.4;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease;
        }


        .n5-option:hover {

            border-color:
                rgba(108,99,217,0.28);

            background: #faf8ff;

            transform: translateY(-1px);
        }


        .n5-option input {

            accent-color: #6258ce;

            flex-shrink: 0;
        }


        /* =====================================================
           SUBMIT
        ====================================================== */

        .n5-submit {

            width: 100%;

            min-height: 47px;

            margin-top: 22px;

            border: none;

            border-radius: 11px;

            background: #6258ce;

            color: #ffffff;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            transition:
                background 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .n5-submit:hover {

            background: #4e45b8;

            transform: translateY(-1px);

            box-shadow:
                0 10px 22px rgba(98,88,206,0.18);
        }


        /* =====================================================
           BACK
        ====================================================== */

        .n5-back {

            display: inline-flex;

            align-items: center;

            justify-content: center;

            gap: 7px;

            min-height: 42px;

            margin-top: 20px;

            padding: 0 15px;

            background: #f2effb;

            border:
                1px solid #e1dcec;

            border-radius: 10px;

            color: #6258ce;

            text-decoration: none;

            font-size: 13px;

            font-weight: 700;

            transition:
                background 0.2s ease,
                color 0.2s ease,
                transform 0.2s ease;
        }


        .n5-back:hover {

            background: #e8e4f7;

            color: #4e45b8;

            transform: translateY(-1px);
        }


        /* =====================================================
           DARK MODE
        ====================================================== */

        body.dark-mode .n5-card {

            background:
                linear-gradient(
                    135deg,
                    rgba(29,31,45,0.95),
                    rgba(37,36,54,0.91)
                );

            border-color:
                rgba(255,255,255,0.08);

            box-shadow:
                0 18px 45px rgba(0,0,0,0.25);
        }


        body.dark-mode .n5-top {

            border-bottom-color:
                #3b3e52;

            color:
                #aaa6bb;
        }


        body.dark-mode .n5-score {

            color:
                #aaa3ff;
        }


        body.dark-mode .n5-progress-bar {

            background:
                #303246;
        }


        body.dark-mode .n5-category {

            background:
                #302e50;

            border-color:
                #41445b;

            color:
                #aaa3ff;
        }


        body.dark-mode .n5-title {

            color:
                #f5f2ff;
        }


        body.dark-mode .n5-subtitle {

            color:
                #aaa6bb;
        }


        body.dark-mode .n5-question {

            background:
                linear-gradient(
                    135deg,
                    #302e50,
                    #292c40
                );

            border-color:
                #41445b;

            color:
                #f0edf8;
        }


        body.dark-mode .n5-english {

            color:
                #aaa6bb;
        }


        body.dark-mode .n5-speaker {

            background:
                #302e50;

            border-color:
                #41445b;

            color:
                #aaa3ff;
        }


        body.dark-mode .n5-speaker:hover {

            background:
                #3a3c52;

            color:
                #c0baff;
        }


        body.dark-mode .n5-speaker.speaking {

            background:
                #766de0;

            border-color:
                #766de0;

            color:
                #ffffff;
        }


        body.dark-mode .n5-option {

            background:
                rgba(37,40,56,0.82);

            border-color:
                #41445b;

            color:
                #d4d0df;
        }


        body.dark-mode .n5-option:hover {

            background:
                #303246;

            border-color:
                #6258ce;
        }


        body.dark-mode .n5-back {

            background:
                #252838;

            border-color:
                #41445b;

            color:
                #aaa3ff;
        }


        body.dark-mode .n5-back:hover {

            background:
                #303348;

            color:
                #c0baff;
        }


        /* =====================================================
           MOBILE
        ====================================================== */

        @media (max-width: 600px) {

            .n5-page {

                width:
                    calc(100% - 24px);

                padding-top:
                    22px;
            }


            .n5-card {

                padding:
                    24px 18px;
            }


            .n5-top {

                align-items:
                    flex-start;

                flex-direction:
                    column;

                gap:
                    12px;
            }


            .n5-progress-bar {

                width:
                    100%;
            }


            .n5-score {

                align-self:
                    flex-end;
            }


            .n5-title {

                font-size:
                    25px;
            }


            .n5-question-row {

                align-items:
                    flex-start;

                gap:
                    9px;
            }


            .n5-question {

                font-size:
                    18px;

                padding:
                    17px;
            }


            .n5-speaker {

                width:
                    42px;

                height:
                    42px;

                font-size:
                    17px;
            }


            .n5-option {

                padding:
                    14px;
            }


            .n5-back {

                width:
                    100%;
            }

        }

    </style>

</head>


<body>


    <!-- =====================================================
         QUESTION DATA FOR JAVASCRIPT
    ====================================================== -->

    <script
        id="n5-question-data"
        type="application/json"
    >{{ question.question | tojson }}</script>


    <!-- =====================================================
         MAIN
    ====================================================== -->

    <main class="n5-page">


        <section class="n5-card">


            <!-- =================================================
                 TOP / PROGRESS
            ================================================== -->

            <div class="n5-top">


                <div>

                    <span class="n5-progress-text">

                        Question
                        {{ question_number }}
                        /
                        {{ total_questions }}

                    </span>


                    <div
                        class="n5-progress-bar"
                        id="n5ProgressBar"
                        data-current="{{ question_number }}"
                        data-total="{{ total_questions }}"
                    >

                        <div
                            class="n5-progress-fill"
                            id="n5ProgressFill"
                        ></div>

                    </div>

                </div>


                <span class="n5-score">

                    Score:
                    {{ score }}

                </span>


            </div>


            <!-- =================================================
                 CATEGORY
            ================================================== -->

            <div class="n5-category">

                {{ question.category }}

            </div>


            <!-- =================================================
                 TITLE
            ================================================== -->

            <h1 class="n5-title">

                🎓 JLPT N5 Practice

            </h1>


            <p class="n5-subtitle">

                Beginner Japanese practice —
                {{ username }}

            </p>


            <!-- =================================================
                 QUESTION + SPEAKER
            ================================================== -->

            <div class="n5-question-row">


                <div class="n5-question">

                    {{ question.question }}

                </div>


                <button
                    type="button"
                    class="n5-speaker"
                    id="n5Speaker"
                    title="Listen to Japanese"
                    aria-label="Listen to Japanese"
                >

                    <i class="fa-solid fa-volume-high"></i>

                </button>


            </div>


            <!-- =================================================
                 ENGLISH HELP
            ================================================== -->

            <div class="n5-english">

                {{ question.english }}

            </div>


            <!-- =================================================
                 ANSWERS
            ================================================== -->

            <form method="POST">


                <div class="n5-options">


                    {% for option in question.options %}


                        <label class="n5-option">


                            <input
                                type="radio"
                                name="answer"
                                value="{{ option }}"
                                required
                            >


                            <span>

                                {{ option }}

                            </span>


                        </label>


                    {% endfor %}


                </div>


                <button
                    type="submit"
                    class="n5-submit"
                >

                    Check Answer →

                </button>


            </form>


            <!-- =================================================
                 BACK
            ================================================== -->

            <a
                href="/jlpt"
                class="n5-back"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Back to JLPT

            </a>


        </section>


    </main>


    <!-- =====================================================
         JAVASCRIPT
    ====================================================== -->

    <script>

        /* =====================================================
           ELEMENTS
        ====================================================== */

        const n5Speaker =
            document.getElementById("n5Speaker");


        const n5ProgressBar =
            document.getElementById("n5ProgressBar");


        const n5ProgressFill =
            document.getElementById("n5ProgressFill");


        /* =====================================================
           JAPANESE QUESTION DATA
        ====================================================== */

        const japaneseQuestion =
            JSON.parse(
                document.getElementById(
                    "n5-question-data"
                ).textContent
            );


        /* =====================================================
           PROGRESS
        ====================================================== */

        const currentQuestion =
            Number(
                n5ProgressBar.dataset.current
            );


        const totalQuestions =
            Number(
                n5ProgressBar.dataset.total
            );


        let progressPercentage = 0;


        if (totalQuestions > 0) {

            progressPercentage =
                (
                    currentQuestion /
                    totalQuestions
                ) * 100;
        }


        n5ProgressFill.style.width =
            progressPercentage + "%";


        /* =====================================================
           GET JAPANESE VOICE
        ====================================================== */

        function getJapaneseVoice() {

            if (
                !("speechSynthesis" in window)
            ) {

                return null;
            }


            const voices =
                window.speechSynthesis.getVoices();


            return voices.find(
                function (voice) {

                    return (
                        voice.lang &&
                        voice.lang
                            .toLowerCase()
                            .startsWith("ja")
                    );

                }
            ) || null;
        }


        /* =====================================================
           SPEAK QUESTION
        ====================================================== */

        function speakN5Question() {

            if (
                !("speechSynthesis" in window)
            ) {

                alert(
                    "Your browser does not support Japanese speech."
                );

                return;
            }


            const enabled =
                localStorage.getItem(
                    "pronunciation"
                );


            if (
                enabled === "false"
            ) {

                alert(
                    "Japanese pronunciation is disabled in Settings."
                );

                return;
            }


            const text =
                String(
                    japaneseQuestion || ""
                ).trim();


            if (!text) {

                return;
            }


            /* Stop previous speech */

            window.speechSynthesis.cancel();


            /* Create speech */

            const speech =
                new SpeechSynthesisUtterance(
                    text
                );


            speech.lang =
                "ja-JP";


            speech.rate =
                0.8;


            speech.pitch =
                1;


            /* Select Japanese voice */

            const japaneseVoice =
                getJapaneseVoice();


            if (japaneseVoice) {

                speech.voice =
                    japaneseVoice;
            }


            /* Button state */

            n5Speaker.classList.add(
                "speaking"
            );


            /* Speech finished */

            speech.onend =
                function () {

                    n5Speaker.classList.remove(
                        "speaking"
                    );

                };


            /* Speech error */

            speech.onerror =
                function () {

                    n5Speaker.classList.remove(
                        "speaking"
                    );

                    console.error(
                        "Japanese speech failed."
                    );

                };


            /* Speak */

            window.speechSynthesis.speak(
                speech
            );
        }


        /* =====================================================
           SPEAKER CLICK
        ====================================================== */

        if (n5Speaker) {

            n5Speaker.addEventListener(
                "click",
                speakN5Question
            );

        }


        /* =====================================================
           VOICE INITIALIZATION
        ====================================================== */

        if (
            "speechSynthesis" in window
        ) {

            window.speechSynthesis.onvoiceschanged =
                function () {

                    window.speechSynthesis.getVoices();

                };

        }

    </script>


    <!-- =====================================================
         DARK MODE
    ====================================================== -->

    <script
        src="{{ url_for('static', filename='js/darkmode.js') }}"
    ></script>


</body>

</html>
