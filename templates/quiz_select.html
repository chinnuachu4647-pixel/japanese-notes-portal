<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Japanese Quiz</title>


    <!-- =====================================================
         MAIN THEME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/style.css') }}"
    >


    <!-- =====================================================
         FIXED BACKGROUND
    ====================================================== -->

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='css/app-background.css') }}"
    >


    <!-- =====================================================
         FONT AWESOME
    ====================================================== -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"
    >


    <style>

        /* =====================================================
           RESET
        ===================================================== */

        * {
            box-sizing: border-box;
        }


        /* =====================================================
           PAGE
        ===================================================== */

        body {
            margin: 0;
            min-height: 100vh;

            background: transparent !important;

            color: #302b43;

            font-family:
                Arial,
                "Helvetica Neue",
                Helvetica,
                sans-serif;
        }


        /* =====================================================
           CONTAINER
        ===================================================== */

        .quiz-container {
            width: min(820px, calc(100% - 40px));

            margin: 0 auto;

            padding: 36px 0 70px;

            position: relative;

            z-index: 2;
        }


        /* =====================================================
           MAIN CARD
        ===================================================== */

        .quiz-card {
            position: relative;

            padding: 34px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255,255,255,0.93),
                    rgba(249,246,255,0.86)
                );

            border: 1px solid rgba(255,255,255,0.90);

            border-radius: 24px;

            box-shadow:
                0 16px 42px rgba(65,50,110,0.11);

            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);

            overflow: hidden;
        }


        .quiz-card::before {
            content: "";

            position: absolute;

            width: 220px;
            height: 220px;

            top: -115px;
            right: -105px;

            border-radius: 50%;

            background:
                rgba(108,99,217,0.07);

            pointer-events: none;
        }


        /* =====================================================
           HEADER
        ===================================================== */

        .quiz-card h1 {
            position: relative;

            z-index: 2;

            margin: 0;

            color: #302b43;

            font-size: 30px;

            font-weight: 700;

            line-height: 1.25;
        }


        .quiz-card > p {
            position: relative;

            z-index: 2;

            margin: 8px 0 25px;

            color: #77718e;

            font-size: 14px;

            line-height: 1.55;
        }


        /* =====================================================
           ALL COMPLETED LESSONS
        ===================================================== */

        .all-option {
            position: relative;

            z-index: 2;

            margin-bottom: 15px;

            padding: 17px 18px;

            background:
                linear-gradient(
                    135deg,
                    #f0edff,
                    #faf8ff
                );

            border: 1px solid #e3def1;

            border-radius: 14px;

            color: #4f4960;

            transition:
                border-color 0.2s ease,
                background 0.2s ease,
                transform 0.2s ease;
        }


        .all-option:hover {
            border-color:
                rgba(108,99,217,0.28);

            transform: translateY(-2px);
        }


        .all-option label {
            display: flex;

            align-items: center;

            gap: 11px;

            cursor: pointer;
        }


        .all-option input,
        .lesson-option input[type="radio"] {
            width: 17px;
            height: 17px;

            flex-shrink: 0;

            margin: 0;

            accent-color: #6258ce;
        }


        .all-option strong {
            color: #403a55;

            font-size: 14px;
        }


        /* =====================================================
           LESSON OPTIONS
        ===================================================== */

        .lesson-option {
            position: relative;

            z-index: 2;

            display: flex;

            align-items: center;

            gap: 11px;

            margin: 10px 0;

            padding: 16px 17px;

            background:
                rgba(255,255,255,0.75);

            border: 1px solid #e7e2f0;

            border-radius: 13px;

            color: #514b61;

            font-size: 14px;

            line-height: 1.45;

            cursor: pointer;

            transition:
                background 0.2s ease,
                border-color 0.2s ease,
                transform 0.2s ease,
                box-shadow 0.2s ease;
        }


        .lesson-option:hover {
            background:
                rgba(250,247,255,0.96);

            border-color:
                rgba(108,99,217,0.25);

            transform: translateX(2px);

            box-shadow:
                0 7px 18px rgba(65,50,110,0.06);
        }


        /* Hide the hidden lesson ID cleanly */

        .lesson-option input[type="hidden"] {
            display: none;
        }


        /* =====================================================
           START QUIZ
        ===================================================== */

        .quiz-btn {
            position: relative;

            z-index: 2;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            min-height: 46px;

            margin-top: 20px;

            padding: 0 20px;

            background:
                linear-gradient(
                    135deg,
                    #6258ce,
                    #766de0
                );

            color: #ffffff !important;

            border: none;

            border-radius: 11px;

            font-size: 14px;

            font-weight: 700;

            text-decoration: none;

            cursor: pointer;

            box-shadow:
                0 8px 20px rgba(98,88,206,0.22);

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                box-shadow 0.2s ease;
        }


        .quiz-btn:hover {
            background:
                linear-gradient(
                    135deg,
                    #4e45b8,
                    #6258ce
                );

            color: #ffffff !important;

            transform: translateY(-2px);

            box-shadow:
                0 11px 24px rgba(98,88,206,0.30);
        }


        /* =====================================================
           HISTORY
        ===================================================== */

        .history-section {
            position: relative;

            z-index: 2;

            display: flex;

            align-items: center;

            justify-content: space-between;

            gap: 15px;

            margin-top: 28px;

            padding-top: 22px;

            border-top: 1px solid #eeeaf5;
        }


        .history-description {
            margin: 0;

            color: #827b94;

            font-size: 12px;
        }


        .history-btn {
            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            min-height: 41px;

            padding: 0 15px;

            border-radius: 10px;

            background: #f2effb;

            border: 1px solid #e1dcec;

            color: #6258ce;

            text-decoration: none;

            font-size: 13px;

            font-weight: 700;

            flex-shrink: 0;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                color 0.2s ease;
        }


        .history-btn:hover {
            background: #e8e4f7;

            color: #4e45b8;

            transform: translateY(-2px);
        }


        /* =====================================================
           BACK
        ===================================================== */

        .back-btn {
            position: relative;

            z-index: 2;

            display: inline-flex;

            align-items: center;
            justify-content: center;

            gap: 8px;

            margin-top: 22px;

            min-height: 42px;

            padding: 0 15px;

            background: rgba(255,255,255,0.86);

            border: 1px solid #e3deed;

            border-radius: 10px;

            color: #6258ce;

            text-decoration: none;

            font-size: 13px;

            font-weight: 700;

            transition:
                transform 0.2s ease,
                background 0.2s ease,
                color 0.2s ease;
        }


        .back-btn:hover {
            background: #f3efff;

            color: #4e45b8;

            transform: translateX(-3px);
        }


        /* =====================================================
           DARK MODE
        ===================================================== */

        body.dark-mode .quiz-card {
            background:
                linear-gradient(
                    135deg,
                    rgba(29,31,45,0.95),
                    rgba(37,36,54,0.91)
                );

            border-color:
                rgba(255,255,255,0.08);

            box-shadow:
                0 16px 42px rgba(0,0,0,0.25);
        }


        body.dark-mode .quiz-card h1 {
            color: #f5f2ff;
        }


        body.dark-mode .quiz-card > p {
            color: #aaa6bb;
        }


        body.dark-mode .all-option {
            background:
                linear-gradient(
                    135deg,
                    #302e50,
                    #292c40
                );

            border-color: #41445b;

            color: #ddd9e8;
        }


        body.dark-mode .all-option strong {
            color: #eeeaf7;
        }


        body.dark-mode .lesson-option {
            background:
                rgba(29,31,45,0.72);

            border-color: #41445b;

            color: #d6d1df;
        }


        body.dark-mode .lesson-option:hover {
            background:
                rgba(35,37,53,0.88);

            border-color:
                rgba(145,136,242,0.40);
        }


        body.dark-mode .history-section {
            border-color: #3f4256;
        }


        body.dark-mode .history-description {
            color: #9993aa;
        }


        body.dark-mode .history-btn {
            background: #252838;

            border-color: #41445b;

            color: #aaa3ff;
        }


        body.dark-mode .history-btn:hover {
            background: #303348;

            color: #c0baff;
        }


        body.dark-mode .back-btn {
            background: #252838;

            border-color: #41445b;

            color: #aaa3ff;
        }


        body.dark-mode .back-btn:hover {
            background: #303348;

            color: #c0baff;
        }


        /* =====================================================
           MOBILE
        ===================================================== */

        @media (max-width: 600px) {

            .quiz-container {
                width: calc(100% - 24px);

                padding-top: 22px;
            }


            .quiz-card {
                padding: 24px 18px;

                border-radius: 19px;
            }


            .quiz-card h1 {
                font-size: 25px;
            }


            .quiz-card > p {
                font-size: 12px;
            }


            .lesson-option {
                padding: 14px;

                font-size: 13px;
            }


            .quiz-btn {
                width: 100%;
            }


            .history-section {
                flex-direction: column;

                align-items: stretch;
            }


            .history-btn {
                width: 100%;
            }


            .back-btn {
                width: 100%;
            }
        }

    </style>

</head>


<body>


    <main class="quiz-container">


        <section class="quiz-card">


            <!-- =================================================
                 HEADER
            ================================================== -->

            <h1>
                📝 Japanese Quiz
            </h1>


            <p>
                Choose a completed lesson to start your quiz.
            </p>


            <!-- =================================================
                 AVAILABLE LESSONS
            ================================================== -->

            {% if completed_lessons %}


                <form method="POST">


                    <!-- ALL COMPLETED LESSONS -->

                    <div class="all-option">

                        <label>

                            <input
                                type="radio"
                                name="quiz_type"
                                value="all"
                                required
                            >

                            <strong>
                                📚 Quiz All Completed Lessons
                            </strong>

                        </label>

                    </div>


                    <!-- INDIVIDUAL LESSONS -->

                    {% for lesson in completed_lessons %}

                        <label class="lesson-option">

                            <input
                                type="radio"
                                name="quiz_type"
                                value="lesson"
                            >


                            <input
                                type="hidden"
                                name="lesson_id"
                                value="{{ lesson[0] }}"
                            >


                            <span>
                                📖 {{ lesson[1] }} —
                                {{ lesson[2] }}
                            </span>

                        </label>

                    {% endfor %}


                    <button
                        type="submit"
                        class="quiz-btn"
                    >

                        <i class="fa-solid fa-rocket"></i>

                        Start Quiz

                    </button>

                </form>


            {% else %}


                <!-- =================================================
                     NO COMPLETED LESSONS
                ================================================== -->

                <p>
                    You have not completed any lessons yet.
                </p>


                <a
                    href="/notes"
                    class="quiz-btn"
                >

                    <i class="fa-solid fa-book-open"></i>

                    Go to Notes

                </a>


            {% endif %}


            <!-- =================================================
                 QUIZ HISTORY
            ================================================== -->

            <div class="history-section">


                <p class="history-description">

                    Review your previous quiz attempts.

                </p>


                <a
                    href="/quiz/history"
                    class="history-btn"
                >

                    <i class="fa-solid fa-chart-column"></i>

                    Quiz History

                </a>

            </div>


            <!-- =================================================
                 BACK
            ================================================== -->

            <a
                href="/learning_hub"
                class="back-btn"
            >

                <i class="fa-solid fa-arrow-left"></i>

                Back to Learning Hub

            </a>


        </section>

    </main>


    <!-- =====================================================
         DARK MODE
    ====================================================== -->

    <script
        src="{{ url_for('static', filename='js/darkmode.js') }}">
    </script>


    <!-- =====================================================
         PRONUNCIATION
    ====================================================== -->

    <script
        src="{{ url_for('static', filename='js/pronunciation.js') }}">
    </script>


</body>

</html>
